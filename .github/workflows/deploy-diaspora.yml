name: Deploy AFR Diaspora Publisher

# Deployment workflow for the isolated AFR diaspora publisher.
on:
  push:
    branches:
      - main
    paths:
      - "worker-diaspora.js"
      - "wrangler-diaspora.toml"
      - "content/diaspora-finance-series-10-articles.md"
      - ".github/workflows/deploy-diaspora.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy isolated diaspora Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "8048ebdc03a5b799ff0eb60cebc6200c"
          command: deploy --config wrangler-diaspora.toml
