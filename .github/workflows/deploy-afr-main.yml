name: Deploy AFR Main Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "diaspora-stories.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-afr-main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy the existing AFR Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "8048ebdc03a5b799ff0eb60cebc6200c"
          command: deploy --config wrangler.toml
