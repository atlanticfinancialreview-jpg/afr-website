name: Validate AFR Worker

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Validate Cloudflare Worker configuration and assets
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir=/tmp/afr-worker-check
